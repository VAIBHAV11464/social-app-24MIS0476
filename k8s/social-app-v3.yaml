# Social App v3 (Add Post, Like, Comment) -> http://localhost:30003
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-app-v3
  labels:
    app: social-app
    version: v3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social-app
      version: v3
  template:
    metadata:
      labels:
        app: social-app
        version: v3
    spec:
      containers:
        - name: social-app
          image: aniketdevops1/social-app:v3
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: social-app-v3-service
spec:
  type: NodePort
  selector:
    app: social-app
    version: v3
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30003
