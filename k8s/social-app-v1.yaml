# Social App v1 (Add Post) -> http://localhost:30001
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-app-v1
  labels:
    app: social-app
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social-app
      version: v1
  template:
    metadata:
      labels:
        app: social-app
        version: v1
    spec:
      containers:
        - name: social-app
          image: DOCKERHUB_USERNAME/social-app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: social-app-v1-service
spec:
  type: NodePort
  selector:
    app: social-app
    version: v1
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30001
