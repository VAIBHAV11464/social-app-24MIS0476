# Social App v2 (Add Post, Like) -> http://localhost:30002
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-app-v2
  labels:
    app: social-app
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: social-app
      version: v2
  template:
    metadata:
      labels:
        app: social-app
        version: v2
    spec:
      containers:
        - name: social-app
          image: DOCKERHUB_USERNAME/social-app:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: social-app-v2-service
spec:
  type: NodePort
  selector:
    app: social-app
    version: v2
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30002
